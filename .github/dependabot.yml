version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript 7 needs a check redesign: `astro check` only supports TS 5–6.
    # Hold the major until we migrate to @astrojs/ts-content-mapper (TS 7.1+).
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      astro:
        applies-to: security-updates
        patterns:
          - "astro"
          - "@astrojs/*"
      react:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        applies-to: security-updates
        patterns:
          - "vite"
          - "@vitejs/*"
      version-updates:
        applies-to: version-updates
        patterns: ['*']
