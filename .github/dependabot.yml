version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        applies-to: security-updates
        patterns:
          - "astro"
          - "@astrojs/*"
      react:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        applies-to: security-updates
        patterns:
          - "vite"
          - "@vitejs/*"
